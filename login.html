<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Armer Luxury</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section id="auth">
        <div id="login-container">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Usuario" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <input type="number" id="login-age" placeholder="Edad" min="1" required>
                <button type="submit">Entrar</button>
                <p>¿No tienes cuenta? <a href="#" id="show-register">Regístrate</a></p>
            </form>
        </div>
        <div id="register-container" style="display:none;">
            <h2>Registro</h2>
            <form id="register-form">
                <input type="text" id="register-username" placeholder="Usuario" required>
                <input type="password" id="register-password" placeholder="Contraseña" required>
                <input type="password" id="register-password2" placeholder="Repite la contraseña" required>
                <input type="number" id="register-age" placeholder="Edad" min="1" required>
                <button type="submit">Registrarse</button>
                <p>¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a></p>
            </form>
        </div>
    </section>
    <script src="js/dom.js"></script>
</body>
</html>
