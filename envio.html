<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programar Envío - Armer Luxury</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="brand">
            <img src="img/logo.png" alt="Armer Luxury Logo" class="logo">
            <h1>Armer Luxury</h1>
        </div>
        <h2>Programar Envío de Productos</h2>
    </header>
    <nav style="margin-bottom: 24px;">
        <a href="index.html">Inicio</a> |
        <a href="productos.html">Productos</a> |
        <a href="carrito.html">Carrito</a> |
        <a href="envio.html">Programar Envío</a>|
        <a href="pqrs.html">PQRS</a>
    </nav>
    <section id="envio">
        <form id="envio-form" style="background:#222;max-width:400px;margin:0 auto;padding:32px 28px 24px 28px;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,0.25);display:flex;flex-direction:column;gap:16px;align-items:center;">
            <label for="producto" style="align-self:flex-start;font-weight:bold;color:#d4af37;">Producto:</label>
            <select id="producto" required style="width:100%;padding:10px;border-radius:6px;border:none;background:#333;color:#fff;">
                <option value="">Seleccione un producto</option>
                <option value="Pistola Glock">Pistola Glock</option>
                <option value="Rifle M4">Rifle M4</option>
                <option value="Escopeta">Escopeta</option>
                <option value="Bereta">Bereta</option>
                <option value="Revolver">Revolver</option>
                <option value="Uzi">Uzi</option>
            </select>
            <label for="cantidad" style="align-self:flex-start;font-weight:bold;color:#d4af37;">Cantidad:</label>
            <input type="number" id="cantidad" min="1" max="10" required style="width:100%;padding:10px;border-radius:6px;border:none;background:#333;color:#fff;">
            <label for="fecha" style="align-self:flex-start;font-weight:bold;color:#d4af37;">Fecha de envío:</label>
            <input type="date" id="fecha" required style="width:100%;padding:10px;border-radius:6px;border:none;background:#333;color:#fff;">
            <label for="direccion" style="align-self:flex-start;font-weight:bold;color:#d4af37;">Dirección de entrega:</label>
            <input type="text" id="direccion" required style="width:100%;padding:10px;border-radius:6px;border:none;background:#333;color:#fff;">
            <button type="submit" style="width:100%;padding:12px 0;background:#d4af37;color:#111;border:none;border-radius:6px;font-weight:bold;font-size:1.1em;margin-top:10px;transition:background 0.2s;">Programar Envío</button>
        </form>
        <div id="envio-exito" style="display:none; margin-top:20px; color:#d4af37; font-weight:bold;">¡Envío programado exitosamente!</div>
    </section>
    <script>
    document.getElementById('envio-form').addEventListener('submit', function(e) {
        e.preventDefault();
        // Aquí podrías guardar en localStorage o enviar a un backend
        window.location.href = 'pagos.html';
    });
    </script>
</body>
</html>
