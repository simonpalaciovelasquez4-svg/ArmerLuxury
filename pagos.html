<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - Armer Luxury</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="brand">
            <img src="img/logo.png" alt="Armer Luxury Logo" class="logo">
            <h1>Armer Luxury</h1>
        </div>
        <h2>Realizar Pago</h2>
    </header>
     <nav style="margin-bottom: 24px;">
        <a href="index.html">Inicio</a> |
        <a href="productos.html">Productos</a> |
        <a href="carrito.html">Carrito</a> |
        <a href="envio.html">Programar Envío</a>|
        <a href="pqrs.html">PQRS</a>
    </nav>
    <section id="pagos" style="max-width:420px;margin:0 auto;background:#222;padding:32px 28px 24px 28px;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,0.25);">
        <h3 style="color:#d4af37;">Selecciona método de pago</h3>
        <form id="pago-form" style="display:flex;flex-direction:column;gap:18px;margin-top:18px;">
            <label style="display:flex;align-items:center;gap:10px;">
                <input type="radio" name="metodo" value="paypal" required>
                <span>PayPal</span>
            </label>
            <label style="display:flex;align-items:center;gap:10px;">
                <input type="radio" name="metodo" value="transferencia" required>
                <span>Transferencia Bancaria</span>
            </label>
            <button type="submit" style="padding:12px 0;background:#d4af37;color:#111;border:none;border-radius:6px;font-weight:bold;font-size:1.1em;margin-top:10px;transition:background 0.2s;">Continuar</button>
        </form>
    </section>
    <script>
    document.getElementById('pago-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const metodo = document.querySelector('input[name=metodo]:checked').value;
        if(metodo === 'paypal') {
            window.location.href = 'paypal.html';
        } else {
            window.location.href = 'transferencia.html';
        }
    });
    </script>
</body>
</html>
